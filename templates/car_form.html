<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Car</title>
</head>
<body>
    <h1>Add New Car</h1>

    <form method="post">
        <p>
            <label>Brand:</label><br>
            <input type="text" name="brand" required>
        </p>

        <p>
            <label>Model:</label><br>
            <input type="text" name="model" required>
        </p>

        <p>
            <label>Type:</label><br>
            <input type="text" name="car_type" placeholder="Sedan / SUV / Hatchback" required>
        </p>

        <p>
            <label>Rental Rate per Day:</label><br>
            <input type="number" step="0.01" name="rental_rate" required>
        </p>

        <p>
            <label>Status:</label><br>
            <select name="availability_status">
                <option value="Available">Available</option>
                <option value="Rented">Rented</option>
            </select>
        </p>

        <p>
            <button type="submit">Save</button>
            <a href="/admin/cars">Cancel</a>
        </p>
    </form>
</body>
</html>
